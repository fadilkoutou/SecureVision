<style>
:root{--bg:#f3f6fb;--panel:#fff;--nav:#10243b;--nav2:#173957;--text:#172b4d;--muted:#64748b;--line:#e2e8f0;--blue:#2878d0;--cyan:#18a7a0;--green:#16805d;--orange:#c77718;--red:#c24141;--shadow:0 10px 28px rgba(16,36,59,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,var(--nav),#0a1929);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brandmark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#2b91e7,#15b9a5);display:grid;place-items:center;font-size:23px;box-shadow:0 8px 20px #0003}.brand h1{font-size:17px;margin:0}.brand small{display:block;color:#9fb5ca;font-size:11px;margin-top:3px}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#8ea6bc;padding:0 12px;margin-bottom:5px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;border:0;color:#c5d3df;background:transparent;padding:12px;border-radius:10px;text-align:left;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff17;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;border-top:1px solid #ffffff20;padding:15px 8px 0;color:#8ea6bc;font-size:11px;line-height:1.5}.main{min-width:0}.topbar{background:#fff;border-bottom:1px solid var(--line);padding:17px 28px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:3}.top-title{font-size:19px;font-weight:750}.top-sub{font-size:12px;color:var(--muted);margin-top:4px}.top-actions{display:flex;align-items:center;gap:10px}.role-select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:white;color:var(--text);max-width:190px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#d8f2ee;color:#116d69;font-weight:800}.content{padding:25px 28px 35px;max-width:1500px;margin:auto}.welcome{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}.welcome h2{font-size:24px;margin:0 0 7px}.welcome p{margin:0;color:var(--muted);font-size:13px}.eyebrow{font-size:11px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:7px}.btn{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:10px 14px;font-size:12px;font-weight:700;box-shadow:0 5px 12px #2878d022}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#eef5fc;color:#245d96;box-shadow:none}.btn.ghost{background:white;color:var(--text);border:1px solid var(--line);box-shadow:none}.btn.small{padding:7px 10px;font-size:11px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid #e7edf4;border-radius:15px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;gap:8px}.stat-icon{width:36px;height:36px;border-radius:11px;background:#edf5ff;display:grid;place-items:center;font-size:17px}.stat-number{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:12px 0 5px}.stat-note{font-size:11px;color:var(--muted)}.positive{color:var(--green)}.dashboard-grid{grid-template-columns:minmax(0,1.45fr) minmax(270px,.8fr)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{font-size:15px;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.camera-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.camera{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.camera-preview{height:120px;background:linear-gradient(140deg,#152b3f,#274b60);position:relative;display:flex;align-items:center;justify-content:center;color:#8bb5c7}.camera-preview:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 70%,#0a1a2b99)}.camera-preview .camicon{font-size:32px;opacity:.85}.camera-preview .tag{position:absolute;top:10px;left:10px;z-index:1}.camera-preview .rec{position:absolute;top:11px;right:11px;color:#ff7373;font-size:10px;font-weight:800;z-index:1}.camera-preview .viewlabel{position:absolute;bottom:9px;left:10px;color:#fff;font-size:10px;z-index:1}.camera-info{padding:12px}.camera-name{font-weight:750;font-size:12px}.camera-meta{font-size:10px;color:var(--muted);margin-top:5px}.status{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:750;white-space:nowrap}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.online{background:#e5f7ef;color:#16805d}.status.warning{background:#fff4df;color:#a6630c}.status.offline{background:#feecec;color:#b73333}.status.info{background:#e9f3ff;color:#2766a3}.alert-list{display:grid;gap:12px}.alert{display:flex;gap:10px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid #edf1f5}.alert:last-child{border-bottom:0;padding-bottom:0}.alert-icon{width:32px;height:32px;border-radius:10px;background:#fff4df;display:grid;place-items:center;flex-shrink:0}.alert strong{font-size:12px;display:block;margin-bottom:4px}.alert p{font-size:11px;color:var(--muted);margin:0;line-height:1.45}.alert time{font-size:10px;color:#8a9aae;display:block;margin-top:5px}.learning-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.course-icon{width:44px;height:44px;display:grid;place-items:center;background:#eaf4ff;border-radius:12px;font-size:22px;margin-bottom:13px}.course h3{font-size:14px;margin:0 0 8px}.course p{font-size:12px;color:var(--muted);line-height:1.6;min-height:56px}.progress{height:7px;background:#e9eff5;border-radius:9px;overflow:hidden;margin:12px 0 8px}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:9px}.course-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);align-items:center}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:570px;background:#fff}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid #edf1f5;font-size:11px}th{font-size:10px;color:#708198;background:#f8fafc;text-transform:uppercase;letter-spacing:.7px}tr:last-child td{border-bottom:0}.device-cell{display:flex;align-items:center;gap:9px;font-weight:750}.device-symbol{width:30px;height:30px;background:#edf5ff;border-radius:9px;display:grid;place-items:center}.muted{color:var(--muted)}.panel-grid{grid-template-columns:1fr 1fr}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:11px;font-weight:750;color:#51657e}.field input,.field select,.field textarea{border:1px solid #d9e2ec;border-radius:9px;padding:10px 11px;background:white;outline:none;width:100%;font-size:12px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2878d018}.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.lesson{line-height:1.7;font-size:13px;color:#41536b}.lesson h4{color:var(--text);margin-bottom:5px}.lesson code{background:#edf4fb;padding:2px 5px;border-radius:4px}.callout{border-left:3px solid var(--cyan);background:#effaf8;padding:12px 14px;border-radius:0 9px 9px 0;font-size:12px;line-height:1.6;margin:12px 0}.toast{position:fixed;bottom:22px;right:22px;background:#10243b;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;z-index:10;animation:fadein .2s ease}@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.mobile-menu{display:none}.hidden{display:none!important}.footnote{font-size:10px;color:#8191a5;line-height:1.5;margin-top:18px}.tagpill{padding:5px 8px;border-radius:6px;background:#f1f5f9;font-size:10px;color:#52657d}
@media(max-width:1000px){.app{grid-template-columns:205px 1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}.learning-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:20px}.topbar{padding:15px 20px}}
@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:8;inset:0 auto 0 0;width:260px;transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 0 0 100vmax #0a192966}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:9px}.topbar{padding:12px 14px}.top-title{font-size:16px}.top-sub{display:none}.top-actions{gap:6px}.role-select{max-width:135px;padding:8px 5px;font-size:11px}.avatar{display:none}.content{padding:18px 13px 28px}.welcome{align-items:flex-start}.welcome h2{font-size:21px}.welcome p{max-width:280px;line-height:1.5}.welcome .btn{padding:9px 10px}.stats{gap:10px}.card{padding:14px;border-radius:12px}.stat-number{font-size:24px}.stat-top{font-size:10px}.stat-icon{width:30px;height:30px}.camera-grid,.learning-grid,.panel-grid{grid-template-columns:1fr}.camera-preview{height:145px}.formrow{grid-template-columns:1fr}.section-head{align-items:flex-start}.top-actions .role-select{max-width:118px}.brand{padding-top:5px}}

:root{--bg:#050b0c;--panel:#0b1719;--nav:#061110;--nav2:#0c2920;--text:#e8f5f2;--muted:#91aaa5;--line:#1b3838;--blue:#00df83;--cyan:#00e6b8;--green:#00e68a;--orange:#ffbd4a;--red:#ff5570;--shadow:0 12px 30px rgba(0,0,0,.22)}
body{background:radial-gradient(ellipse at 75% -10%,#10372e 0,transparent 42%),var(--bg);color:var(--text)}

.topbar{background:#071211eF;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.top-title{color:var(--text)}.top-sub{color:var(--muted)}

.status.online{background:#0e3024;color:#72ffb5}.status.warning{background:#352817;color:#ffcf7b}.status.offline{background:#391923;color:#ff91a1}.status.info{background:#102b35;color:#8be0ff}
.alert{border-color:#1b3030}.alert-icon{background:#342a18;color:#ffd17e}.muted{color:var(--muted)}
.learning-grid .course,.course{color:var(--text)}.course p{color:var(--muted)}.progress{background:#203331}.progress span{background:linear-gradient(90deg,#00e68a,#00d6b8)}.course-foot{color:var(--muted)}
table{background:#091516;color:var(--text)}th{background:#102020;color:#9cb8af;border-color:var(--line)}td{border-color:#1b3030;color:#d7e8e4}.tablewrap{border-color:var(--line)}.tagpill{background:#142624;color:#aac6bd}.field label{color:#b9d0ca}.field input,.field select,.field textarea{background:#071313;color:var(--text);border-color:#25403e}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #00e68a18}
.callout{border-left-color:var(--green);background:#0d2920;color:#bfe8d5}.lesson{color:#b6cdc5}.lesson h4{color:var(--text)}.lesson code{background:#17372b;color:#c8ffe0}.footnote{color:#7f9c92}.toast{background:#12372b;border:1px solid #27855b;color:#d8ffed}
.mobile-menu{background:#0b1b1b;border-color:var(--line);color:var(--text)}

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brandmark">◈</div><div><h1>SecureVision</h1><small>Security Operations Hub</small></div></div>
    <div><div class="navlabel">Espace de travail</div><nav class="nav" id="nav">
      <button class="active" data-page="dashboard"><span class="ico">▦</span>Tableau de bord</button>
      <button data-page="cameras"><span class="ico">◉</span>Vidéosurveillance</button>
      <button data-page="network"><span class="ico">⌘</span>Réseau & sécurité</button>
      <button data-page="incidents"><span class="ico">⚑</span>Incidents & alertes</button>
      <button data-page="clients"><span class="ico">♙</span>Clients & équipe</button>
      <button data-page="learning"><span class="ico">▤</span>Centre d'apprentissage</button>
      <button data-page="reports"><span class="ico">▧</span>Rapports</button>
    </nav></div>
    <div class="sidefoot">VERSION 1.0 · DÉMONSTRATION<br>Les données affichées sont fictives.<br>Connectez uniquement des équipements autorisés.</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:11px;min-width:0">
        <button class="mobile-menu" id="menuBtn" aria-label="Ouvrir le menu">☰</button>
        <div><div class="top-title" id="pageTitle">Tableau de bord</div><div class="top-sub">Vue d'ensemble de votre environnement de sécurité</div></div>
      </div>
      <div class="top-actions">
        <select class="role-select" id="roleSelect" aria-label="Choisir un rôle">
          <option value="admin">Administrateur</option><option value="technician">Technicien</option><option value="client">Client</option>
        </select>
        <div class="avatar" id="avatar">AD</div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="toastHost"></div>
<script>
const state = {
 role:"admin", page:"dashboard",
 cameras:[
  {id:1,name:"Entrée principale",site:"Site Démo — Douala",ip:"192.168.1.21",status:"online",zone:"Entrée",recording:true},
  {id:2,name:"Zone de stockage",site:"Site Démo — Douala",ip:"192.168.1.22",status:"online",zone:"Stockage",recording:true},
  {id:3,name:"Parking arrière",site:"Site Démo — Douala",ip:"192.168.1.23",status:"warning",zone:"Parking",recording:true},
  {id:4,name:"Couloir technique",site:"Site Démo — Douala",ip:"192.168.1.24",status:"offline",zone:"Couloir",recording:false}
 ],
 incidents:[
  {id:101,title:"Caméra hors ligne",detail:"Couloir technique · Caméra 04",time:"Aujourd'hui · 09:42",level:"high",status:"Ouvert"},
  {id:102,title:"Vérification de maintenance",detail:"Parking arrière · Caméra 03",time:"Aujourd'hui · 08:15",level:"medium",status:"En cours"},
  {id:103,title:"Mise à jour planifiée",detail:"Routeur du site de démonstration",time:"Hier · 16:30",level:"low",status:"Résolu"}
 ],
 clients:[
  {name:"Commerce Démo",site:"Douala",devices:4,plan:"Maintenance",status:"Actif"},
  {name:"Bureau Exemple",site:"Bonamoussadi",devices:8,plan:"Surveillance",status:"Actif"}
 ],
 courses:[
  {id:1,icon:"⌘",title:"Les bases des réseaux",desc:"Comprendre IP, routeur, switch, DNS et les connexions locales.",level:"Débutant",progress:25,lessons:["Qu'est-ce qu'un réseau ?","Adresse IP et passerelle","Routeur, switch et Wi-Fi"]},
  {id:2,icon:"◈",title:"Fondamentaux de cybersécurité",desc:"Comptes, mots de passe, MFA, mises à jour et sauvegardes.",level:"Débutant",progress:10,lessons:["Confidentialité, intégrité, disponibilité","Mots de passe et MFA","Reconnaître le phishing"]},
  {id:3,icon:"◉",title:"Vidéosurveillance IP",desc:"Caméras IP, PoE, NVR, enregistrement et confidentialité.",level:"Débutant",progress:0,lessons:["Architecture d'un système IP","PoE et câblage","Stockage et accès aux images"]},
  {id:4,icon:"⚑",title:"Gestion des incidents",desc:"Documenter une panne, évaluer son impact et assurer le suivi.",level:"Débutant",progress:0,lessons:["Créer un ticket","Prioriser un incident","Clôturer et rédiger un rapport"]}
 ]
};
try{const saved=localStorage.getItem("securevision-v2-state");if(saved){const parsed=JSON.parse(saved);if(parsed&&Array.isArray(parsed.cameras)&&Array.isArray(parsed.incidents)&&Array.isArray(parsed.clients)&&Array.isArray(parsed.courses)){state.cameras=parsed.cameras;state.incidents=parsed.incidents;state.clients=parsed.clients;state.courses=parsed.courses;}}}catch(e){}
function persistState(){try{localStorage.setItem("securevision-v2-state",JSON.stringify({cameras:state.cameras,incidents:state.incidents,clients:state.clients,courses:state.courses}));}catch(e){}}
const titles={dashboard:"Tableau de bord",cameras:"Vidéosurveillance",network:"Réseau & sécurité",incidents:"Incidents & alertes",clients:"Clients & équipe",learning:"Centre d'apprentissage",reports:"Rapports"};
const roleNames={admin:"Administrateur",technician:"Technicien",client:"Client"};
const $=id=>document.getElementById(id);
function toast(msg){$("toastHost").innerHTML=`<div class="toast">${escapeHtml(msg)}</div>`;setTimeout(()=>$("toastHost").innerHTML="",3000)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function statusBadge(s){const m={online:["online","En ligne"],warning:["warning","À vérifier"],offline:["offline","Hors ligne"],high:["offline","Priorité haute"],medium:["warning","Priorité moyenne"],low:["online","Priorité basse"]};let a=m[s]||["info",s];return `<span class="status ${a[0]}">${a[1]}</span>`}
function stat(label,num,note,icon){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-number">${num}</div><div class="stat-note">${note}</div></div>`}
function cameraCards(list=state.cameras){return `<div class="grid camera-grid">${list.map(c=>`<div class="camera"><div class="camera-preview"><span class="tag status ${c.status}">${c.status==="online"?"En ligne":c.status==="warning"?"À vérifier":"Hors ligne"}</span><span class="camicon">◉</span>${c.recording?'<span class="rec">● REC</span>':''}<span class="viewlabel">APERÇU DE DÉMONSTRATION</span></div><div class="camera-info"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="camera-name">${escapeHtml(c.name)}</span><span class="tagpill">${escapeHtml(c.zone)}</span></div><div class="camera-meta">${escapeHtml(c.site)} · ${escapeHtml(c.ip)}</div><div style="display:flex;gap:7px;margin-top:12px"><button class="btn secondary small" onclick="cameraDetails(${c.id})">Détails</button>${state.role!=="client"?`<button class="btn ghost small" onclick="createCameraIncident(${c.id})">Signaler</button>`:""}</div></div></div>`).join("")}</div>`}
function incidentRows(){return state.incidents.map(i=>`<tr><td><b>${escapeHtml(i.title)}</b><div class="muted" style="margin-top:4px">${escapeHtml(i.detail)}</div></td><td>${escapeHtml(i.time)}</td><td>${statusBadge(i.level)}</td><td><span class="tagpill">${escapeHtml(i.status)}</span></td><td>${state.role!=="client"&&i.status!=="Résolu"?`<button class="btn secondary small" onclick="resolveIncident(${i.id})">Clôturer</button>`:"—"}</td></tr>`).join("")}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Aucun élément pour le moment.</td></tr>`}</tbody></table></div>`}
function dashboard(){const online=state.cameras.filter(c=>c.status==="online").length;const open=state.incidents.filter(i=>i.status!=="Résolu").length;
return `<div class="welcome"><div><div class="eyebrow">Vue d'ensemble · ${roleNames[state.role]}</div><h2>Bonjour, bienvenue 👋</h2><p>Voici un aperçu de votre environnement de sécurité de démonstration.</p></div>${state.role!=="client"?'<button class="btn" onclick="go(\'incidents\');newIncident()">＋ Nouvel incident</button>':''}</div>
<div class="grid stats">${stat("Caméras en ligne",`${online}/${state.cameras.length}`,"État simulé des équipements","◉")}${stat("Incidents à suivre",open,open?"Nécessitent une vérification":"Aucun incident ouvert","⚑")}${stat("Sites suivis",state.role==="client"?"1":state.clients.length,"Sites de démonstration","⌂")}${stat("Parcours d'apprentissage",`${state.courses.filter(c=>c.progress>0).length}/${state.courses.length}`,"Cours commencés","▤")}</div>
<div class="grid dashboard-grid"><div class="card"><div class="section-head"><div><h3>État des caméras</h3><p>Aperçus illustratifs, pas de flux vidéo réel</p></div><button class="btn secondary small" onclick="go('cameras')">Voir tout</button></div>${cameraCards(state.cameras.slice(0,2))}</div>
<div class="card"><div class="section-head"><div><h3>Alertes récentes</h3><p>Suivi des événements déclarés</p></div><button class="btn ghost small" onclick="go('incidents')">Tout voir</button></div><div class="alert-list">${state.incidents.slice(0,3).map(i=>`<div class="alert"><div class="alert-icon">${i.level==="high"?"⚠":"◷"}</div><div><strong>${escapeHtml(i.title)}</strong><p>${escapeHtml(i.detail)}</p><time>${escapeHtml(i.time)}</time></div></div>`).join("")}</div></div></div>
<div class="card" style="margin-top:16px"><div class="section-head"><div><h3>Continuer à apprendre</h3><p>Avancez à votre rythme, étape par étape</p></div><button class="btn secondary small" onclick="go('learning')">Ouvrir les cours</button></div><div class="grid learning-grid">${state.courses.slice(0,3).map(courseMini).join("")}</div></div>
<div class="footnote">Données de démonstration uniquement. Cette version ne se connecte à aucune caméra, ne vérifie pas un vrai réseau et ne remplace pas un système de surveillance professionnel.</div>`}
function courseMini(c){return `<div class="course"><div class="course-icon">${c.icon}</div><h3>${escapeHtml(c.title)}</h3><p>${escapeHtml(c.desc)}</p><div class="progress"><span style="width:${c.progress}%"></span></div><div class="course-foot"><span>${c.progress}% terminé</span><button class="btn secondary small" onclick="openCourse(${c.id})">Apprendre</button></div></div>`}
function camerasPage(){return `<div class="welcome"><div><div class="eyebrow">Équipements</div><h2>Vidéosurveillance IP</h2><p>Inventaire et état simulé des caméras enregistrées.</p></div>${state.role!=="client"?'<button class="btn" onclick="showAddCamera()">＋ Ajouter une caméra</button>':""}</div><div class="grid stats">${stat("Total caméras",state.cameras.length,"Inventaire démo","◉")}${stat("En ligne",state.cameras.filter(c=>c.status==="online").length,"Répondent dans la simulation","✓")}${stat("À vérifier",state.cameras.filter(c=>c.status==="warning").length,"Contrôle recommandé","⚠")}${stat("Hors ligne",state.cameras.filter(c=>c.status==="offline").length,"Incident possible","×")}</div><div class="card"><div class="section-head"><div><h3>Liste des caméras</h3><p>Les adresses IP sont fictives et ne sont pas testées.</p></div><input id="cameraSearch" placeholder="Rechercher une caméra…" style="max-width:220px;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:11px" oninput="filterCameras(this.value)"></div><div id="cameraList">${cameraCards()}</div></div><div class="callout"><b>À savoir :</b> la vidéo en direct sera ajoutée plus tard avec du matériel compatible et un accès sécurisé. Ne publiez pas directement les interfaces de vos caméras sur Internet.</div>`}
function networkPage(){return `<div class="welcome"><div><div class="eyebrow">Infrastructure</div><h2>Réseau & sécurité</h2><p>Liste pédagogique des équipements d'un petit réseau.</p></div></div><div class="grid panel-grid"><div class="card"><div class="section-head"><h3>Schéma simplifié</h3><span class="tagpill">Exemple</span></div><div style="display:grid;gap:9px;text-align:center;max-width:400px;margin:auto"><div class="card" style="box-shadow:none;background:#eef6ff">🌐 Internet (exemple)</div><div style="color:#8ba1b6">↓</div><div class="card" style="box-shadow:none">🛡️ Routeur / pare-feu</div><div style="color:#8ba1b6">↓</div><div class="card" style="box-shadow:none">🔀 Switch réseau / PoE</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><div class="card" style="box-shadow:none;background:#effaf8">📹 Caméras IP</div><div class="card" style="box-shadow:none;background:#f8f2ff">💾 NVR / stockage</div></div></div><p class="muted" style="font-size:11px;line-height:1.6;margin-top:16px">Schéma conceptuel uniquement. La configuration réelle dépend du matériel, du plan d'adressage et des besoins du site.</p></div><div class="card"><div class="section-head"><h3>Bonnes pratiques</h3></div><div class="alert-list"><div class="alert"><div class="alert-icon">🔐</div><div><strong>Comptes sécurisés</strong><p>Remplacer les mots de passe par défaut et activer la MFA si disponible.</p></div></div><div class="alert"><div class="alert-icon">🔄</div><div><strong>Mises à jour</strong><p>Utiliser les mises à jour officielles après vérification de compatibilité.</p></div></div><div class="alert"><div class="alert-icon">🚧</div><div><strong>Accès limité</strong><p>Restreindre l'accès aux caméras et au NVR aux personnes autorisées.</p></div></div><div class="alert"><div class="alert-icon">💾</div><div><strong>Sauvegardes</strong><p>Tester régulièrement la restauration et protéger les exports vidéo.</p></div></div></div></div></div><div class="card" style="margin-top:16px"><div class="section-head"><div><h3>Inventaire des équipements</h3><p>Exemple fictif, à remplacer après validation sur site.</p></div></div>${table(["Équipement","Adresse exemple","Rôle","État"],`<tr><td>Routeur de démonstration</td><td>192.168.1.1</td><td>Passerelle</td><td>${statusBadge("online")}</td></tr><tr><td>Switch PoE de démonstration</td><td>192.168.1.2</td><td>Connexion caméras</td><td>${statusBadge("online")}</td></tr><tr><td>NVR de démonstration</td><td>192.168.1.10</td><td>Enregistrement</td><td>${statusBadge("warning")}</td></tr>`)}</div>`}
function incidentsPage(){return `<div class="welcome"><div><div class="eyebrow">Suivi opérationnel</div><h2>Incidents & alertes</h2><p>Enregistrer, prioriser et suivre les incidents techniques.</p></div>${state.role!=="client"?'<button class="btn" onclick="newIncident()">＋ Créer un incident</button>':""}</div><div class="grid stats">${stat("Incidents ouverts",state.incidents.filter(i=>i.status==="Ouvert").length,"À prendre en charge","⚑")}${stat("En cours",state.incidents.filter(i=>i.status==="En cours").length,"Intervention en cours","◷")}${stat("Résolus",state.incidents.filter(i=>i.status==="Résolu").length,"Historique","✓")}${stat("Total",state.incidents.length,"Incidents enregistrés dans cette session","▤")}</div><div class="card"><div class="section-head"><h3>Journal des incidents</h3><button class="btn ghost small" onclick="exportIncidents()">Exporter CSV</button></div>${table(["Incident","Date / heure","Priorité","Statut","Action"],incidentRows())}</div><div class="footnote">Les incidents ajoutés dans cette version restent dans la mémoire de la page. Ils ne sont pas encore enregistrés dans une base de données.</div>`}
function clientsPage(){let clientView=state.role==="client";return `<div class="welcome"><div><div class="eyebrow">Gestion des accès</div><h2>${clientView?"Mon site":"Clients & équipe"}</h2><p>${clientView?"Consultez les informations de votre site de démonstration.":"Vue fictive des clients et des techniciens de maintenance."}</p></div>${state.role==="admin"?'<button class="btn" onclick="showAddClient()">＋ Ajouter un client</button>':""}</div><div class="grid stats">${stat("Clients",clientView?"1":state.clients.length,"Comptes de démonstration","♙")}${stat("Techniciens",state.role==="client"?"—":"2","Équipe exemple","⚒")}${stat("Équipements suivis",clientView?state.clients[0].devices:state.clients.reduce((n,c)=>n+c.devices,0),"Inventaire fictif","◉")}${stat("Contrats actifs",clientView?"1":state.clients.length,"À confirmer en production","▤")}</div><div class="card"><div class="section-head"><h3>${clientView?"Informations du site":"Sites clients"}</h3></div>${table(["Client / site","Localisation","Équipements","Service","Statut"],(clientView?state.clients.slice(0,1):state.clients).map(c=>`<tr><td><b>${escapeHtml(c.name)}</b></td><td>${escapeHtml(c.site)}</td><td>${c.devices}</td><td>${escapeHtml(c.plan)}</td><td>${statusBadge("online")}</td></tr>`).join(""))}</div>${state.role!=="client"?`<div class="card" style="margin-top:16px"><div class="section-head"><h3>Équipe technique (exemple)</h3></div>${table(["Nom","Rôle","Spécialité","Statut"],`<tr><td>Technicien Démo A</td><td>Technicien</td><td>Caméras IP & câblage</td><td>${statusBadge("online")}</td></tr><tr><td>Technicien Démo B</td><td>Technicien</td><td>Réseaux & maintenance</td><td>${statusBadge("online")}</td></tr>`)}</div>`:"" }<div class="callout">Dans une version en production, les rôles seront appliqués côté serveur. Changer le rôle ici sert uniquement à prévisualiser l'interface ; ce n'est pas une vraie protection d'accès.</div>`}
function learningPage(){return `<div class="welcome"><div><div class="eyebrow">Formation continue</div><h2>Centre d'apprentissage</h2><p>Des leçons courtes pour apprendre à votre rythme.</p></div></div><div class="grid learning-grid">${state.courses.map(c=>`<div class="card course"><div class="course-icon">${c.icon}</div><span class="tagpill">${c.level}</span><h3 style="margin-top:12px">${escapeHtml(c.title)}</h3><p>${escapeHtml(c.desc)}</p><div class="progress"><span style="width:${c.progress}%"></span></div><div class="course-foot"><span>${c.progress}% terminé</span><button class="btn secondary small" onclick="openCourse(${c.id})">Ouvrir le cours</button></div></div>`).join("")}</div><div class="callout"><b>Conseil pour débuter :</b> commence par « Les bases des réseaux », puis passe aux fondamentaux de cybersécurité. Les exercices doivent se faire sur tes propres appareils ou avec autorisation explicite.</div><div id="lessonArea"></div>`}
function reportsPage(){return `<div class="welcome"><div><div class="eyebrow">Documentation</div><h2>Rapports</h2><p>Préparer des résumés techniques et exporter les données de démonstration.</p></div></div><div class="grid panel-grid"><div class="card"><div class="course-icon">▧</div><h3>Résumé des caméras</h3><p class="muted" style="font-size:12px;line-height:1.6">Exporter la liste de l'inventaire de démonstration pour la vérifier ou la remplacer par des données réelles autorisées.</p><button class="btn" onclick="exportCameras()">Exporter l'inventaire CSV</button></div><div class="card"><div class="course-icon">⚑</div><h3>Rapport d'incidents</h3><p class="muted" style="font-size:12px;line-height:1.6">Télécharger les incidents de cette session au format CSV pour les ouvrir dans un tableur.</p><button class="btn" onclick="exportIncidents()">Exporter les incidents CSV</button></div></div><div class="callout">Les exports contiennent uniquement les données fictives actuellement affichées. Avant un déploiement réel, il faudra ajouter une base de données, des contrôles d'accès et des sauvegardes.</div>`}
function render(){ persistState(); $("pageTitle").textContent=titles[state.page];document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));const pages={dashboard,cameras:camerasPage,network:networkPage,incidents:incidentsPage,clients:clientsPage,learning:learningPage,reports:reportsPage};$("content").innerHTML=pages[state.page]();$("sidebar").classList.remove("open");$("avatar").textContent=state.role==="admin"?"AD":state.role==="technician"?"TE":"CL";document.querySelector(".top-sub").textContent=state.role==="client"?"Espace client · démonstration":"Vue d'ensemble de votre environnement de sécurité"}
function go(page){state.page=page;render();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
$("roleSelect").addEventListener("change",e=>{state.role=e.target.value;render();toast("Aperçu du rôle : "+roleNames[state.role])});
$("menuBtn").addEventListener("click",()=>$("sidebar").classList.toggle("open"));
function cameraDetails(id){const c=state.cameras.find(x=>x.id===id);alert(`CAMÉRA DE DÉMONSTRATION\n\nNom : ${c.name}\nSite : ${c.site}\nIP fictive : ${c.ip}\nÉtat simulé : ${c.status}\n\nAucun flux vidéo réel n'est connecté.`)}
function createCameraIncident(id){const c=state.cameras.find(x=>x.id===id);state.incidents.unshift({id:Date.now(),title:"Vérification demandée",detail:c.name+" · "+c.ip,time:"À l'instant",level:"medium",status:"Ouvert"});toast("Incident de démonstration créé");go("incidents")}
function newIncident(){const title=prompt("Titre de l'incident (ex. : Caméra à vérifier)");if(!title)return;const detail=prompt("Site ou équipement concerné")||"Non précisé";state.incidents.unshift({id:Date.now(),title,detail,time:"À l'instant",level:"medium",status:"Ouvert"});toast("Incident ajouté à la session");render()}
function resolveIncident(id){const i=state.incidents.find(x=>x.id===id);if(i){i.status="Résolu";toast("Incident clôturé dans cette session");render()}}
function showAddCamera(){const name=prompt("Nom de la caméra");if(!name)return;const ip=prompt("Adresse IP de démonstration (ex. 192.168.1.30)")||"Non renseignée";state.cameras.push({id:Date.now(),name,site:"Site à confirmer",ip,status:"warning",zone:"À définir",recording:false});toast("Caméra ajoutée à l'inventaire de démonstration");render()}
function showAddClient(){const name=prompt("Nom du client");if(!name)return;const site=prompt("Ville ou site")||"À préciser";state.clients.push({name,site,devices:0,plan:"À définir",status:"Actif"});toast("Client ajouté à la session");render()}
function filterCameras(q){const list=state.cameras.filter(c=>(c.name+" "+c.site+" "+c.ip).toLowerCase().includes(q.toLowerCase()));$("cameraList").innerHTML=cameraCards(list)}
function openCourse(id){const c=state.courses.find(x=>x.id===id);if(!c)return;const area=$("lessonArea");if(!area){go("learning");setTimeout(()=>openCourse(id),0);return}area.innerHTML=`<div class="card" style="margin-top:18px"><div class="section-head"><div><div class="eyebrow">Leçon débutant</div><h3>${escapeHtml(c.title)}</h3></div><button class="btn ghost small" onclick="document.getElementById('lessonArea').innerHTML=''">Fermer</button></div><div class="lesson"><p>${escapeHtml(c.desc)}</p><h4>Plan du cours</h4><ol>${c.lessons.map(l=>`<li>${escapeHtml(l)}</li>`).join("")}</ol><h4>Petit exercice</h4><p>${c.id===1?"Sur ton ordinateur, ouvre l'invite de commandes et exécute <code>ipconfig</code>. Repère l'adresse IPv4 et la passerelle par défaut. Note les résultats sans les publier en ligne.":c.id===2?"Vérifie que tes comptes importants utilisent des mots de passe uniques. Active la MFA si elle est proposée et repère les mises à jour disponibles.":c.id===3?"Dessine le chemin : caméra IP → switch PoE → NVR → écran. Indique qui est autorisé à voir les images.": "Choisis un problème fictif, écris l'heure, l'équipement touché, l'impact, l'action prévue et le statut."}</p><div class="callout"><b>Règle de sécurité :</b> fais les exercices uniquement sur tes appareils ou avec une autorisation explicite.</div><button class="btn" onclick="completeCourse(${c.id})">Marquer la leçon comme étudiée</button></div></div>`;area.scrollIntoView({behavior:"smooth",block:"start"})}
function completeCourse(id){const c=state.courses.find(x=>x.id===id);if(c)c.progress=Math.min(100,c.progress+25);toast("Progression mise à jour pour cette session");render()}
function downloadCsv(filename,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);toast("Export préparé")}
function exportCameras(){downloadCsv("securevision-cameras-demo.csv",[["ID","Nom","Site","IP exemple","État","Zone"],...state.cameras.map(c=>[c.id,c.name,c.site,c.ip,c.status,c.zone])])}
function exportIncidents(){downloadCsv("securevision-incidents-demo.csv",[["ID","Titre","Détail","Date","Priorité","Statut"],...state.incidents.map(i=>[i.id,i.title,i.detail,i.time,i.level,i.status])])}
render();
</script>
</body>
</html>
